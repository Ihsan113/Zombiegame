name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Explicitly avoid the retired "tools" package.
          packages: 'platform-tools'

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 stable and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          GODOT_TAG="${GODOT_VERSION}-stable"
          TEMPLATE_DIR="${GODOT_VERSION}.stable"
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p unpacked_templates "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          unzip -q templates.tpz -d unpacked_templates
          test -d unpacked_templates/templates
          cp -a unpacked_templates/templates/. "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}/"
          ./godot --version

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          # Generate a local debug keystore for CI-only debug APK signing.
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Verify landscape configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'window/handheld/orientation=0' project.godot
          grep -Fx 'screen/orientation=0' export_presets.cfg
          ! grep -Eq 'screen_set_orientation|window/handheld/orientation=1|screen/orientation=1' scripts/game.gd project.godot export_presets.cfg

      - name: Verify project resources and landscape settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          root = Path('.')
          required = [Path('project.godot'), Path('Main.tscn'), Path('scripts/game.gd'), Path('export_presets.cfg'), Path('assets/game_icon.png')]
          missing = [str(path) for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit('Missing required project files: ' + ', '.join(missing))
          project = (root / 'project.godot').read_text()
          preset = (root / 'export_presets.cfg').read_text()
          if 'window/handheld/orientation=0' not in project or 'screen/orientation=0' not in preset:
              raise SystemExit('Landscape orientation must be set in both Godot and Android export preset')
          sources = [root / 'project.godot', root / 'Main.tscn', root / 'scripts/game.gd']
          refs = set()
          for source in sources:
              refs.update(re.findall(r"res://([^\"\'\s)]+)", source.read_text()))
          missing_refs = sorted(ref for ref in refs if not (root / ref).exists())
          if missing_refs:
              raise SystemExit('Broken res:// references: ' + ', '.join(missing_refs))
          script = (root / 'scripts/game.gd').read_text()
          required_markers = [
              'const ARENA_TOP_RATIO := 0.520',
              'const ARENA_BOTTOM_RATIO := 0.865',
              'const ARENA_TOP_CLEARANCE := 22.0',
              'const ARENA_BOTTOM_CLEARANCE := 40.0',
              'const GRENADE_MAX_CARRY := 5',
              'const GRENADE_MIN_RANGE_RATIO := 0.065',
              'const GRENADE_MAX_RANGE_RATIO := 0.30',
              'const WALL_PLACE_RANGE_RATIO := 0.145',
              'const SNAPSHOT_INTERVAL := 0.0332',
              'const INPUT_INTERVAL := 0.033',
              'const MAX_SNAPSHOT_BYTES := 1180',
              'func _encode_snapshot() -> PackedByteArray:',
              'func _decode_snapshot(buf: PackedByteArray) -> Dictionary:',
              'func submit_input(packed: PackedByteArray) -> void:',
              'func _reconcile_local(rec: Dictionary) -> void:',
              'func _client_update_render(delta: float) -> void:',
              'func _predict_local_fire() -> bool:',
              'func _tune_enet_peer(remote_id: int) -> void:',
              'peer.host.compress(ENetConnection.COMPRESS_FASTLZ)',
              'func _predict_local_player(delta: float) -> void:',
              'var wall_rect := Rect2(pos.x - 60.0, pos.y - 36.0, 120.0, 72.0)',
              'var blast_radius: float = 14.0 + 126.0 * ring_progress',
              'draw_ellipse_shadow(grenade_ground_pos + Vector2(0.0, 5.0), 7.0, 2.6, 0.36)',
              'const MAX_BARRICADES := 8',
              'const GRENADE_BLAST_RADIUS := 112.0',
              '_arena_top() + ARENA_TOP_CLEARANCE, _arena_bottom() - ARENA_BOTTOM_CLEARANCE',
              'func _character_visual_position(',
              'func _draw_footstep_dust(',
              'func _draw_zombie_attack_swipe(',
              'func _all_players_eliminated()',
              'func _draw_game_over_menu()',
              'func receive_game_over_snapshot(',
              'func _wave_duration_for(number: int)',
              'func receive_sfx_event(',
              'var wave_time_remaining',
              'var animation_clock := 0.0',
              'func _host_throw_grenade(id: int, target_x_ratio: float, target_y_ratio: float)',
              'func _host_build_wall(id: int, x_ratio: float, y_ratio: float)',
              'func _draw_grenade_aim_preview()',
              'func _update_grenade_target_from_pointer(pointer_pos: Vector2) -> void',
              'func _begin_grenade_aim(touch_id: int = -1) -> void',
              'func _draw_wall_placement_preview()',
              'func _wall_placement_is_valid(id: int, wall_pos: Vector2)',
              'func _set_wall_preview_from_pointer(pointer_pos: Vector2)',
              'grenade_texture = load("res://assets/grenade_detail.svg") as Texture2D',
              'barricade_texture = load("res://assets/barricade_detail.png") as Texture2D',
              'barricade_texture = load("res://assets/barricade_detail.svg") as Texture2D',
              'airdrop_crate_texture = load("res://assets/airdrop_crate_detail.svg") as Texture2D',
              'parachute_texture = load("res://assets/parachute_detail.svg") as Texture2D',
              'AMMO ∞',
              'func _spawn_airdrop()',
              'func _update_airdrops(delta: float)',
              'func _update_grenades(delta: float)',
              'func _draw_barricade(wall: Dictionary, pos: Vector2)',
              '"grenades": 3',
              '"wall_kits": 2',
              '"ammo": -1',
              'var loot_kind := "grenade"',
              'p["ammo"] = -1 # Unlimited ammunition; -1 is the canonical infinite-ammo sentinel.',
              'loot_tag = "GREN +%d"',
              'loot_kind = "medkit"',
              'loot_kind = "wall"',
              'loot_kind = "grenade"',
              'barricades.remove_at(blocking_wall_index)',
              'if float(wall.get("hp", 0.0)) <= 0.0:',
          ]
          missing_markers = [marker for marker in required_markers if marker not in script]
          if 'ENetMultiplayerPeer.COMPRESS_FASTLZ' in script or 'peer.compression_mode' in script:
              raise SystemExit('Invalid Godot 4.7 compression API: configure peer.host.compress(ENetConnection.COMPRESS_FASTLZ) after creating the peer.')
          if script.count('peer.host.compress(ENetConnection.COMPRESS_FASTLZ)') != 2:
              raise SystemExit('Both LAN host and client must configure identical ENetConnection compression.')
          if missing_markers:
              raise SystemExit('Missing arena/animation implementation markers: ' + ', '.join(missing_markers))
          import wave
          audio_dir = root / 'assets' / 'audio'
          clips = ['shot', 'hit', 'attack', 'death', 'heal', 'wave_clear', 'wave_start', 'game_over', 'grenade_throw', 'explosion', 'airdrop', 'wall_build', 'wall_break', 'pickup']
          for clip in clips:
              audio_path = audio_dir / (clip + '.wav')
              if not audio_path.is_file() or audio_path.stat().st_size < 1000:
                  raise SystemExit('Missing/empty SFX asset: ' + str(audio_path))
              with wave.open(str(audio_path), 'rb') as stream:
                  if stream.getnchannels() != 1 or stream.getframerate() != 22050 or stream.getsampwidth() != 2:
                      raise SystemExit('Unexpected SFX format: ' + str(audio_path))
          if 'func _leave_world() -> void:\n    # Leaving is not an implicit save.' not in script:
              raise SystemExit('World exit must clear runtime state without auto-saving stale zombie positions.')
          if 'if load_saved:\n        if FileAccess.file_exists(SAVE_PATH):\n            _load_world()' not in script:
              raise SystemExit('Saved worlds must only load through explicit Continue Saved action.')
          import xml.etree.ElementTree as ET
          svg_assets = sorted((root / 'assets').glob('*.svg'))
          for svg_path in svg_assets:
              if not svg_path.is_file():
                  raise SystemExit('Missing SVG asset: ' + str(svg_path))
              try:
                  ET.parse(svg_path)
              except ET.ParseError as exc:
                  raise SystemExit('Malformed SVG ' + str(svg_path) + ': ' + str(exc))
          if 'var loot_kind := "ammo"' in script or 'if int(p.get("ammo", 120)) <= 0' in script:
              raise SystemExit('Infinite-ammo build must not retain ammo-consuming gameplay or new ammo drops')
          if 'draw_line(pos + Vector2(-4.0, 10.0), grenade_visual_pos' in script:
              raise SystemExit('Legacy grenade-to-ground tether returned; use ground shadow and directional sparks instead')
          if 'func _predict_local_player(delta: float) -> void:' not in script or 'func _client_update_render(delta: float) -> void:' not in script:
              raise SystemExit('LAN client prediction/snapshot interpolation functions missing')
          if 'rpc("receive_world", players' in script or 'rpc("receive_world", _encode_snapshot' not in script:
              raise SystemExit('World state must be sent as one compact binary snapshot, not as Dictionary/Array RPC arguments')
          if 'rpc_id(1, "submit_input", joystick_vector' in script:
              raise SystemExit('Client movement must use sequence-numbered commands, not a bare joystick vector')
          if 'grenade_slider_touch_id' in script or '_draw_grenade_range_slider' in script or 'grenade_range_slider' in script:
              raise SystemExit('Legacy grenade slider still present; v0.4.6 requires hold-drag-release aiming')
          if 'func _update_grenade_target_from_pointer(pointer_pos: Vector2) -> void' not in script or 'HOLD & DRAG GREN' not in script or 'HOLD & DRAG WALL' not in script:
              raise SystemExit('Hold-drag-release interaction markers are missing')
          print(f'Validated {len(refs)} resource references, landscape settings, infinite ammo, hold-drag grenade/wall controls, {len(svg_assets)} SVG files and {len(clips)} WAV sound effects.')
          PYCODE

      - name: Import and validate project scripts
        shell: bash
        run: |
          set -euo pipefail
          import_log="$(mktemp)"
          if ! ./godot --headless --editor --path . --quit >"$import_log" 2>&1; then
            cat "$import_log"
            exit 1
          fi
          cat "$import_log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$import_log"; then
            echo "::error::Godot reported a script parse/load error during import."
            exit 1
          fi
          smoke_log="$(mktemp)"
          if ! ./godot --headless --path . --quit-after 3 >"$smoke_log" 2>&1; then
            cat "$smoke_log"
            exit 1
          fi
          cat "$smoke_log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$smoke_log"; then
            echo "::error::Godot reported a script parse/load error while starting Main.tscn."
            exit 1
          fi

      - name: Snapshot codec test
        shell: bash
        run: |
          set -euo pipefail
          codec_log="$(mktemp)"
          ./godot --headless --path . -s res://tests/codec_test.gd >"$codec_log" 2>&1 || { cat "$codec_log"; exit 1; }
          cat "$codec_log"
          grep -q 'CODEC TEST: PASS' "$codec_log"

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/PixelZombieLAN.apk
          test -s build/PixelZombieLAN.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelZombieLAN-v0.4.8-APK
          path: build/PixelZombieLAN.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package project source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r build/PixelZombieLAN-v0.4.8-source.zip \
            project.godot Main.tscn export_presets.cfg scripts assets tests tools \
            README.md CHANGELOG.md IMPLEMENTATION_NOTES.md VERSION .gitignore .github/workflows/android.yml
          test -s build/PixelZombieLAN-v0.4.8-source.zip

      - name: Upload project source artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelZombieLAN-v0.4.8-source
          path: build/PixelZombieLAN-v0.4.8-source.zip
          if-no-files-found: error
          retention-days: 14
