name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Explicitly avoid the retired "tools" package.
          packages: 'platform-tools'

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 stable and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          GODOT_TAG="${GODOT_VERSION}-stable"
          TEMPLATE_DIR="${GODOT_VERSION}.stable"
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p unpacked_templates "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          unzip -q templates.tpz -d unpacked_templates
          test -d unpacked_templates/templates
          cp -a unpacked_templates/templates/. "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}/"
          ./godot --version

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          # Generate a local debug keystore for CI-only debug APK signing.
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Verify landscape configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'window/handheld/orientation=0' project.godot
          grep -Fx 'screen/orientation=0' export_presets.cfg
          ! grep -Eq 'screen_set_orientation|window/handheld/orientation=1|screen/orientation=1' scripts/game.gd project.godot export_presets.cfg

      - name: Verify project resources and landscape settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          root = Path('.')
          required = [Path('project.godot'), Path('Main.tscn'), Path('scripts/game.gd'), Path('export_presets.cfg'), Path('assets/game_icon.png')]
          missing = [str(path) for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit('Missing required project files: ' + ', '.join(missing))
          project = (root / 'project.godot').read_text()
          preset = (root / 'export_presets.cfg').read_text()
          if 'window/handheld/orientation=0' not in project or 'screen/orientation=0' not in preset:
              raise SystemExit('Landscape orientation must be set in both Godot and Android export preset')
          if 'version/code=43' not in preset or 'version/name="0.4.31"' not in preset:
              raise SystemExit('Android export preset must report version code 43 / version 0.4.31')
          sources = [root / 'project.godot', root / 'Main.tscn', root / 'scripts/game.gd']
          refs = set()
          for source in sources:
              refs.update(re.findall(r"res://([^\"\'\s)]+)", source.read_text()))
          missing_refs = sorted(ref for ref in refs if not (root / ref).exists())
          if missing_refs:
              raise SystemExit('Broken res:// references: ' + ', '.join(missing_refs))
          # These generated VFX textures must be RGBA; opaque backgrounds produce visible pasted-on rectangles in-game.
          import struct
          def png_metadata(path):
              data = path.read_bytes()
              if len(data) < 33 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit('Malformed PNG asset: ' + str(path))
              width, height = struct.unpack('>II', data[16:24])
              color_type = data[25]
              return width, height, color_type
          for image_name in ['grenade_explosion_asset.png', 'airdrop_crate_generated.png', 'airdrop_parachute_generated.png', 'airdrop_landing_dust_generated.png', 'boss_brute.png', 'boss_attack_slash_sheet.png', 'boss_attack_slam_sheet.png', 'boss_attack_lunge_sheet.png', 'turret_base.png', 'turret_head.png']:
              image_path = root / 'assets' / image_name
              if not image_path.is_file():
                  raise SystemExit('Missing generated VFX PNG: ' + str(image_path))
              image_width, image_height, image_color_type = png_metadata(image_path)
              if image_color_type != 6:
                  raise SystemExit('Generated VFX PNG must use RGBA transparency (PNG color type 6): ' + str(image_path))
              if image_width < 64 or image_height < 32 or image_width > 4096 or image_height > 4096:
                  raise SystemExit('Unexpected generated VFX dimensions: ' + str(image_path))
              if image_name.startswith('boss_attack_') and (image_width != 1680 or image_height != 226):
                  raise SystemExit('Boss attack sheets must be 5 RGBA frames of 336x226: ' + str(image_path))
          turret_sfx = root / 'assets' / 'audio' / 'turret_fire.wav'
          if not turret_sfx.is_file() or turret_sfx.stat().st_size < 1000:
              raise SystemExit('Missing/empty turret firing SFX: ' + str(turret_sfx))
          clean_atlas = root / 'assets' / 'sprite_atlas_player_clean.png'
          if not clean_atlas.is_file():
              raise SystemExit('Missing clean survivor atlas; gun must not be baked into the player sprite.')
          clean_w, clean_h, clean_type = png_metadata(clean_atlas)
          if (clean_w, clean_h, clean_type) != (320, 192, 6):
              raise SystemExit('Clean survivor atlas must remain a 320x192 RGBA image.')
          weapon_assets = ['smg.png', 'shotgun.png', 'rifle.png', 'sniper.png', 'rocket.png']
          weapon_dir = root / 'assets' / 'weapons'
          for weapon_asset in weapon_assets:
              weapon_path = weapon_dir / weapon_asset
              if not weapon_path.is_file():
                  raise SystemExit('Missing firearm sprite: ' + str(weapon_path))
              width, height, color_type = png_metadata(weapon_path)
              if color_type != 6 or width < 128 or height < 64 or width > 4096 or height > 2048:
                  raise SystemExit('Firearm sprites must be valid RGBA cutouts with expected dimensions: ' + str(weapon_path))
          script = (root / 'scripts/game.gd').read_text()
          required_markers = [
              'const ARENA_TOP_RATIO := 0.520',
              'const ARENA_BOTTOM_RATIO := 0.865',
              'const ARENA_TOP_CLEARANCE := 22.0',
              'const ARENA_BOTTOM_CLEARANCE := 40.0',
              'const GRENADE_MAX_CARRY := 5',
              'const GRENADE_MIN_RANGE_RATIO := 0.065',
              'const GRENADE_MAX_RANGE_RATIO := 0.30',
              'const WALL_PLACE_RANGE_RATIO := 0.145',
              'const SNAPSHOT_INTERVAL := 0.0166',
              'const INPUT_INTERVAL := 0.0166',
              'const MAX_SNAPSHOT_BYTES := 1180',
              'func _encode_snapshot() -> PackedByteArray:',
              'func _decode_snapshot(buf: PackedByteArray) -> Dictionary:',
              'func submit_input(packed: PackedByteArray) -> void:',
              'func _reconcile_local(rec: Dictionary) -> void:',
              'func _client_update_render(delta: float) -> void:',
              'func _predict_local_fire() -> bool:',
              'func _tune_enet_peer(remote_id: int) -> void:',
              'func _update_host_view() -> void:',
              'func _draw_barricade_grounding(pos: Vector2, strength: float) -> void:',
              'const BARRICADE_FEET: Array[Vector2]',
              'const BARRICADE_JOIN_GAP := 4.0',
              'const BARRICADE_VERTICAL_SPACING := 60.0',
              'const MAX_TURRETS := 4',
              'const TURRET_RANGE := 270.0',
              'const TURRET_RECORD_BYTES := 8',
              'const TURRET_ARC_HALF_ANGLE := PI * 0.5',
              'func _resolve_turret_collision(from_pos: Vector2, desired_pos: Vector2, padding: float = 8.0) -> Vector2:',
              'const TURRET_BODY_HALF_WIDTH := 35.0',
              'The facing direction is locked when deployed; the head never spins through the back arc.',
              'func _host_build_turret(id: int, x_ratio: float, y_ratio: float, requested_face_x: float = 0.0) -> void:',
              'func _restore_turret_orientation(saved_turret: Dictionary, saved_version: int) -> Dictionary:',
              'func _turret_placement_is_valid(id: int, turret_pos: Vector2) -> bool:',
              'func _update_turrets(delta: float) -> void:',
              'func _draw_turret_entity(turret: Dictionary, is_preview: bool = false, is_valid: bool = true) -> void:',
              'var aim_marker_enabled := true',
              'func _draw_aim_direction_marker() -> void:',
              'func _draw_settings() -> void:',
              'settings_toggle_aim',
              'Large, explicit switch hit target (whole row + track) so Android taps reliably register.',
              'func _weapon_pickup_needs_choice(p: Dictionary, weapon_id: int) -> bool:',
              'func _host_resolve_weapon_replacement(id: int, slot: int) -> void:',
              'weapon_replace_1',
              'res://assets/turret_base.png',
              'res://assets/turret_head.png',
              'res://assets/audio/turret_fire.wav',
              'res://assets/sprite_atlas_player_clean.png',
              'func _snap_wall_preview_to_neighbour(desired: Vector2, player_pos: Vector2) -> Vector2:',
              'var snap_spacing: float = BARRICADE_RECT_SIZE.x + BARRICADE_JOIN_GAP',
              'func _host_track_arrival(track: Dictionary, vt_before: float) -> void:',
              'func _player_draw_pos(id: int, p: Dictionary) -> Vector2:',
              'peer.host.compress(ENetConnection.COMPRESS_FASTLZ)',
              'func _predict_local_player(delta: float) -> void:',
              'var wall_rect := Rect2(pos + BARRICADE_RECT_OFFSET, BARRICADE_RECT_SIZE)',
              'var blast_radius: float = 8.0 + 96.0 * ring_progress',
              'const GRENADE_EXPLOSION_EFFECT_DURATION := 1.65',
              'const AIRDROP_LAND_LIFETIME := 28.0',
              'const AIRDROP_DESPAWN_EFFECT_DURATION := 1.15',
              'const AIRDROP_LANDING_EFFECT_DURATION := 2.0',
              'const BOSS_ATTACK_SLASH := 0',
              'const BOSS_ATTACK_SLAM := 1',
              'const BOSS_ATTACK_LUNGE := 2',
              'func _boss_attack_duration(attack_type: int) -> float:',
              'func _boss_attack_hit_progress(attack_type: int) -> float:',
              'func _boss_attack_frame(attack_type: int, progress: float) -> int:',
              'draw_texture_rect_region(frame_texture, dest, source, tint, false, true)',
              'if attacking and not boss:',
              '_add_combat_effect(8, landing_ground, landing_ground, AIRDROP_LANDING_EFFECT_DURATION)',
              'const PLAYER_DEATH_FADE_DURATION := 1.25',
              'func _update_player_death_visuals(delta: float) -> void:',
              'func _draw_player_death_remains(pos: Vector2, id: int, age: float, facing_left: bool) -> void:',
              'func _draw_death_bones(pos: Vector2, facing_left: bool, alpha: float, age: float) -> void:',
              'func _draw_bone_segment(start: Vector2, finish: Vector2, width: float, alpha: float) -> void:',
              '_add_combat_effect(8, expired_pos, expired_pos, AIRDROP_DESPAWN_EFFECT_DURATION)',
              'if kind == 8:',
              'var label_rect := Rect2(pos.x - 45.0, crate_rect.position.y - 16.0, 90.0, 12.0)',
              'draw_ellipse_shadow(grenade_ground_pos + Vector2(0.0, 5.0), 7.0, 2.6, 0.36)',
              'const MAX_BARRICADES := 8',
              'const GRENADE_BLAST_RADIUS := 112.0',
              '_arena_top() + ARENA_TOP_CLEARANCE, _arena_bottom() - ARENA_BOTTOM_CLEARANCE',
              'func _character_visual_position(',
              'func _draw_footstep_dust(',
              'func _draw_zombie_attack_swipe(',
              'func _all_players_eliminated()',
              'func _draw_game_over_menu()',
              'func receive_game_over_snapshot(',
              'func _wave_duration_for(number: int)',
              'const ZOMBIE_KIND_BOSS := 4',
              'func _zombie_count_for_wave(number: int) -> int:',
              'func _boss_hp_for_wave(number: int) -> float:',
              'func _draw_boss_zombie(',
              'func _draw_airdrop_dust_effects() -> void:',
              'BOSS WAVE %02d',
              'func receive_sfx_event(',
              'var wave_time_remaining',
              'var animation_clock := 0.0',
              'func _host_throw_grenade(id: int, target_x_ratio: float, target_y_ratio: float)',
              'func _host_build_wall(id: int, x_ratio: float, y_ratio: float)',
              'func _draw_grenade_aim_preview()',
              'func _update_grenade_target_from_pointer(pointer_pos: Vector2) -> void',
              'func _begin_grenade_aim(touch_id: int = -1) -> void',
              'func _draw_wall_placement_preview()',
              'func _draw_aim_direction_marker() -> void:',
              'func _wall_placement_is_valid(id: int, wall_pos: Vector2)',
              'func _set_wall_preview_from_pointer(pointer_pos: Vector2)',
              'grenade_texture = load("res://assets/grenade_detail.svg") as Texture2D',
              'grenade_explosion_texture = load("res://assets/grenade_explosion_asset.png") as Texture2D',
              'grenade_explosion_texture = load("res://assets/grenade_explosion_asset.svg") as Texture2D',
              'draw_texture_rect(grenade_explosion_texture, asset_rect, false, Color(0.97, 0.95, 0.90, asset_fade * 0.95))',
              'barricade_texture = load("res://assets/barricade_detail.png") as Texture2D',
              'barricade_texture = load("res://assets/barricade_detail.svg") as Texture2D',
              'airdrop_crate_texture = load("res://assets/airdrop_crate_detail.svg") as Texture2D',
              'parachute_texture = load("res://assets/parachute_detail.svg") as Texture2D',
              'AMMO ∞',
              'func _spawn_airdrop()',
              'func _update_airdrops(delta: float)',
              'func _update_grenades(delta: float)',
              'func _draw_barricade(wall: Dictionary, pos: Vector2)',
              '"grenades": 3',
              '"wall_kits": 2',
              '"ammo": -1',
              'var loot_kind := "grenade"',
              'p["ammo"] = -1',
              'func _weapon_profile(weapon_id: int) -> Dictionary:',
              'func _can_collect_ammo(p: Dictionary, weapon_id: int) -> bool:',
              'func _start_weapon_reload(p: Dictionary, slot: int) -> void:',
              'func _host_switch_weapon(id: int, slot: int) -> void:',
              'func _update_projectiles(delta: float) -> void:',
              'AMMO EMPTY — SIDEARM READY',
              'loot_tag = "GREN +%d"',
              'loot_kind = "medkit"',
              'loot_kind = "wall"',
              'barricades.remove_at(blocking_wall_index)',
              'if float(wall.get("hp", 0.0)) <= 0.0:',
          ]
          missing_markers = [marker for marker in required_markers if marker not in script]
          if 'ENetMultiplayerPeer.COMPRESS_FASTLZ' in script or 'peer.compression_mode' in script:
              raise SystemExit('Invalid Godot 4.7 compression API: configure peer.host.compress(ENetConnection.COMPRESS_FASTLZ) after creating the peer.')
          if 'const SNAPSHOT_HEADER_BYTES := 31' not in script or 'const PLAYER_RECORD_BYTES := 30' not in script or 'const DROP_RECORD_BYTES := 27' not in script or 'const EFFECT_RECORD_BYTES := 16' not in script:
              raise SystemExit('The v0.4.26 snapshot layout must retain its 30-byte player record, 8-byte turret record and 27-byte drop record.')
          if 'rpc("receive_world", _encode_snapshot()' not in script:
              raise SystemExit('Host snapshot broadcast is missing.')
          if script.count('peer.host.compress(ENetConnection.COMPRESS_FASTLZ)') != 2:
              raise SystemExit('Both LAN host and client must configure identical ENetConnection compression.')
          if 'existing_pos.distance_to(wall_pos) < 132.0' in script:
              raise SystemExit('Barricade placement still uses the old 132 px spacing radius.')
          if 'var separation_x: float = absf(existing_pos.x - wall_pos.x)' not in script or 'var separation_y: float = absf(existing_pos.y - wall_pos.y)' not in script:
              raise SystemExit('Barricade placement must check actual horizontal/vertical sprite footprint overlap.')
          if missing_markers:
              raise SystemExit('Missing arena/animation implementation markers: ' + ', '.join(missing_markers))
          import wave
          audio_dir = root / 'assets' / 'audio'
          clips = ['shot', 'hit', 'attack', 'death', 'heal', 'wave_clear', 'wave_start', 'game_over', 'grenade_throw', 'explosion', 'airdrop', 'wall_build', 'wall_break', 'pickup', 'boss_roar', 'boss_attack', 'airdrop_incoming', 'turret_fire']
          for clip in clips:
              audio_path = audio_dir / (clip + '.wav')
              if not audio_path.is_file() or audio_path.stat().st_size < 1000:
                  raise SystemExit('Missing/empty SFX asset: ' + str(audio_path))
              with wave.open(str(audio_path), 'rb') as stream:
                  if stream.getnchannels() != 1 or stream.getframerate() != 22050 or stream.getsampwidth() != 2:
                      raise SystemExit('Unexpected SFX format: ' + str(audio_path))
          if 'func _leave_world() -> void:\n    # Leaving is not an implicit save.' not in script:
              raise SystemExit('World exit must clear runtime state without auto-saving stale zombie positions.')
          if 'if load_saved:\n        if FileAccess.file_exists(SAVE_PATH):\n            _load_world()' not in script:
              raise SystemExit('Saved worlds must only load through explicit Continue Saved action.')
          import xml.etree.ElementTree as ET
          svg_assets = sorted((root / 'assets').glob('*.svg'))
          for svg_path in svg_assets:
              if not svg_path.is_file():
                  raise SystemExit('Missing SVG asset: ' + str(svg_path))
              try:
                  ET.parse(svg_path)
              except ET.ParseError as exc:
                  raise SystemExit('Malformed SVG ' + str(svg_path) + ': ' + str(exc))
          if 'if int(p.get("ammo", 120)) <= 0' in script:
              raise SystemExit('Legacy generic-ammo counter must not gate finite firearm ammo')
          weapon_markers = ['loot_kind = "ammo"', 'loot_kind = "weapon"', 'WEAPON_SIDEARM := 0', 'WEAPON_ROCKET := 5', 'func _give_weapon(p: Dictionary, weapon_id: int, replace_slot: int = 0) -> int:', 'slot1_reserve', 'slot2_reserve', 'AMMO EMPTY — SWITCHED TO SIDEARM']
          codec_test = (root / 'tests/codec_test.gd').read_text()
          if '_can_collect_ammo' not in codec_test or 'reserve-full ammo cache tops up the magazine' not in codec_test or 'partial reserve space is filled before excess ammo tops up the magazine' not in codec_test or 'empty firearm with no reserve switches to default sidearm' not in codec_test or 'weapon airdrop subtype round-trips' not in codec_test or 'has a dedicated firing effect' not in codec_test:
              raise SystemExit('Weapon profile, codec, fallback and ammo pickup regression tests are missing')
          for pickup_test_marker in ['host pickup resolver replaces only selected slot', 'cancel releases weapon crate instead of consuming it']:
              if pickup_test_marker not in codec_test:
                  raise SystemExit('Missing weapon replacement regression test: ' + pickup_test_marker)
          for turret_test_marker in ['turret spot inside placement ring is valid', 'auto-turret tracks and damages a zombie in range', 'turret cannot fire into rear hemisphere', 'left-facing turret can track and fire inside its forward hemisphere', 'legacy world save migrates global turret yaw to left-facing half-arc', 'legacy turret without facing field infers and migrates left-facing yaw', 'current turret save preserves relative angle and facing', 'AIM Settings toggle responds to first touch at switch-row edge', 'AIM Settings tap outside switch does not toggle', 'AIM Settings switch track toggles back on tap', 'AIM toggle maps transformed viewport touch to the same visible row', 'survivor passes through turret body from the left', 'survivor passes through turret body from the opposite direction', 'turret bullet origin follows the real barrel muzzle for both facings', 'turret muzzle vertical origin aligns with the barrel bore, not the old floating-head pivot', 'TUR button enters placement mode without instantly deploying on button release', 'first AIM LEFT placement tap works before draw registers selector hitboxes', 'explicit AIM LEFT selector stays left even when placement point is on the right', 'explicit AIM RIGHT selector stays right even when placement point is on the left', 'host snapshot stores the explicit left-facing choice regardless of placement side', 'first weapon replacement touch works even before draw registers modal hitboxes', 'zombie melee removes the turret it attacked', 'zombie melee preserves an unrelated turret']:
              if turret_test_marker not in codec_test:
                  raise SystemExit('Missing turret regression test: ' + turret_test_marker)
          for turret_destruction_marker in ['var attacked_turret_id: int = int(game.turrets[0].get("id", -1))', 'check(not attacked_turret_still_exists, "zombie melee removes the turret it attacked")', 'check(unrelated_turret_survives, "zombie melee preserves an unrelated turret")']:
              if turret_destruction_marker not in codec_test:
                  raise SystemExit('Turret destruction test must target the attacked turret by ID: ' + turret_destruction_marker)
          if 'check(game.turrets.is_empty(), "zombie melee can destroy a turret")' in codec_test:
              raise SystemExit('Invalid global-empty turret assertion returned; the test intentionally has an unrelated turret.')
          for explicit_type_marker in ['var collision_result: Vector2 = game._resolve_prediction_turret_collision(', 'var collision_result_right: Vector2 = game._resolve_prediction_turret_collision(']:
              if explicit_type_marker not in codec_test:
                  raise SystemExit('Turret collision tests must explicitly type values returned through a dynamic Node: ' + explicit_type_marker)
          if any(marker not in script for marker in weapon_markers):
              raise SystemExit('Finite-ammo weapon and airdrop flow is incomplete')
          if 'draw_line(pos + Vector2(-4.0, 10.0), grenade_visual_pos' in script:
              raise SystemExit('Legacy grenade-to-ground tether returned; use ground shadow and directional sparks instead')
          if 'func _predict_local_player(delta: float) -> void:' not in script or 'func _client_update_render(delta: float) -> void:' not in script:
              raise SystemExit('LAN client prediction/snapshot interpolation functions missing')
          if 'rpc("receive_world", players' in script or 'rpc("receive_world", _encode_snapshot' not in script:
              raise SystemExit('World state must be sent as one compact binary snapshot, not as Dictionary/Array RPC arguments')
          if 'rpc_id(1, "submit_input", joystick_vector' in script:
              raise SystemExit('Client movement must use sequence-numbered commands, not a bare joystick vector')
          if 'grenade_slider_touch_id' in script or '_draw_grenade_range_slider' in script or 'grenade_range_slider' in script:
              raise SystemExit('Legacy grenade slider still present; v0.4.6 requires hold-drag-release aiming')
          if 'func _update_grenade_target_from_pointer(pointer_pos: Vector2) -> void' not in script or 'HOLD & DRAG GREN' not in script or 'HOLD & DRAG WALL' not in script:
              raise SystemExit('Hold-drag-release interaction markers are missing')
          music_path = audio_dir / 'combat_ambience_loop.wav'
          if not music_path.is_file() or music_path.stat().st_size < 100000:
              raise SystemExit('Missing/empty gameplay ambience loop: ' + str(music_path))
          with wave.open(str(music_path), 'rb') as stream:
              if stream.getnchannels() != 1 or stream.getframerate() != 22050 or stream.getsampwidth() != 2:
                  raise SystemExit('Unexpected gameplay ambience format: ' + str(music_path))
          mp3_music_path = audio_dir / 'gameplay_tension_ambience.mp3'
          if not mp3_music_path.is_file() or mp3_music_path.stat().st_size < 1000000:
              raise SystemExit('Missing supplied gameplay ambience MP3: ' + str(mp3_music_path))
          script = (root / 'scripts/game.gd').read_text()
          for marker in ['func _setup_music() -> void:', 'AudioStreamWAV.LOOP_FORWARD', 'AudioStreamMP3', 'mp3_stream.loop = true', 'func _sync_music_state() -> void:', 'AIRDROP_INTERVAL_MIN := 24.0', 'AIRDROP_INTERVAL_MAX := 34.0', '_emit_sfx("boss_roar")', '_emit_sfx("boss_attack")', 'func _input_canvas_position(viewport_position: Vector2) -> Vector2:', 'func _active_ui_hit_id(pos: Vector2) -> String:', 'func _turret_facing_button_rects() -> Dictionary:', 'func _settings_aim_toggle_rect() -> Rect2:', 'func _weapon_replace_hitboxes() -> Dictionary:', 'func _turret_muzzle_position(turret_pos: Vector2, face_x: float, angle_offset: float) -> Vector2:', '_add_combat_effect(13, muzzle, target_pos, 0.17)', 'var pivot := pos + Vector2(0.0, -1.2)', 'Rect2(Vector2(-head_size.x * 0.39 - kick, -head_size.y * 0.84), head_size)', 'func request_build_turret(x_ratio: float, y_ratio: float, face_x: float = 1.0) -> void:', 'turret_face_left', 'turret_face_right', 'The rotating head ring overlaps the foot assembly instead of floating 20+ px above it.']:
              if marker not in script:
                  raise SystemExit('Missing v0.4.31 turret/input/animation/audio/airdrop feature marker: ' + marker)
          print(f'Validated {len(refs)} resource references, landscape/version settings, clean RGBA survivor atlas, five RGBA firearm sprites, destructible deployable auto-turrets with PNG layers/SFX, settings-based aim marker toggle, explicit airdrop slot replacement, finite firearm ammo with infinite sidearm fallback, compatible ammo pickup, hold-drag controls, death/bone visuals, grenade blast, more frequent airdrops, gameplay music, boss/airdrop SFX, {len(svg_assets)} SVG files and {len(clips)} WAV sound effects.')
          PYCODE

      - name: Import and validate project scripts
        shell: bash
        run: |
          set -euo pipefail
          import_log="$(mktemp)"
          if ! ./godot --headless --editor --path . --quit >"$import_log" 2>&1; then
            cat "$import_log"
            exit 1
          fi
          cat "$import_log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$import_log"; then
            echo "::error::Godot reported a script parse/load error during import."
            exit 1
          fi
          smoke_log="$(mktemp)"
          if ! ./godot --headless --path . --quit-after 3 >"$smoke_log" 2>&1; then
            cat "$smoke_log"
            exit 1
          fi
          cat "$smoke_log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$smoke_log"; then
            echo "::error::Godot reported a script parse/load error while starting Main.tscn."
            exit 1
          fi

      - name: Snapshot codec test
        shell: bash
        run: |
          set -euo pipefail
          codec_log="$(mktemp)"
          echo "Running snapshot codec test (90-second safety timeout); live log follows."
          set +e
          timeout --signal=TERM --kill-after=5s 90s \
            stdbuf -oL -eL ./godot --headless --path . -s res://tests/codec_test.gd 2>&1 | tee "$codec_log"
          codec_status=${PIPESTATUS[0]}
          set -e
          if [ "$codec_status" -eq 124 ] || [ "$codec_status" -eq 137 ]; then
            echo "::error::Snapshot codec test exceeded its 90-second timeout. See the last [codec checkpoint] above to locate the stalled section."
            exit 1
          fi
          if [ "$codec_status" -ne 0 ]; then
            echo "::error::Snapshot codec test failed with exit code $codec_status."
            exit "$codec_status"
          fi
          grep -q 'CODEC TEST: PASS' "$codec_log" || { echo "::error::Godot exited without the CODEC TEST: PASS marker."; exit 1; }

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/PixelZombieLAN.apk
          test -s build/PixelZombieLAN.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelZombieLAN-v0.4.31-APK
          path: build/PixelZombieLAN.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package project source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r build/PixelZombieLAN-v0.4.31-source.zip \
            project.godot Main.tscn export_presets.cfg scripts assets art_source tests tools \
            README.md CHANGELOG.md IMPLEMENTATION_NOTES.md VERSION .gitignore .github/workflows/android.yml
          test -s build/PixelZombieLAN-v0.4.31-source.zip

      - name: Upload project source artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelZombieLAN-v0.4.31-source
          path: build/PixelZombieLAN-v0.4.31-source.zip
          if-no-files-found: error
          retention-days: 14
