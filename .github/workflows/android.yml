name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 stable and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          GODOT_TAG="${GODOT_VERSION}-stable"
          TEMPLATE_DIR="${GODOT_VERSION}.stable"
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p unpacked_templates "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          unzip -q templates.tpz -d unpacked_templates
          test -d unpacked_templates/templates
          cp -a unpacked_templates/templates/. "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}/"
          ./godot --version

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          # Generate a local debug keystore for CI-only debug APK signing.
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Import and validate project scripts
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/PixelZombieLAN.apk
          test -s build/PixelZombieLAN.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelZombieLAN-APK
          path: build/PixelZombieLAN.apk
          if-no-files-found: error
          retention-days: 14
